<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7A92"/>
      <stop offset="1" stop-color="#174A5C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2730" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 x 824 rounded square centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- back sheet -->
  <g filter="url(#shadow)">
    <rect x="318" y="226" width="420" height="540" rx="34" fill="#BFD9E1" transform="rotate(7 528 496)"/>
    <!-- front sheet -->
    <rect x="276" y="236" width="420" height="552" rx="34" fill="url(#paper)"/>
  </g>
  <!-- name line and text lines -->
  <rect x="330" y="300" width="200" height="30" rx="15" fill="#1F5F7A"/>
  <rect x="330" y="352" width="300" height="14" rx="7" fill="#9DB8C2"/>
  <rect x="330" y="420" width="140" height="18" rx="9" fill="#1F5F7A" opacity="0.85"/>
  <rect x="330" y="456" width="312" height="14" rx="7" fill="#C5D5DB"/>
  <rect x="330" y="486" width="280" height="14" rx="7" fill="#C5D5DB"/>
  <rect x="330" y="516" width="296" height="14" rx="7" fill="#C5D5DB"/>
  <rect x="330" y="584" width="140" height="18" rx="9" fill="#1F5F7A" opacity="0.85"/>
  <rect x="330" y="620" width="250" height="14" rx="7" fill="#C5D5DB"/>
  <rect x="330" y="650" width="210" height="14" rx="7" fill="#C5D5DB"/>
  <!-- match badge -->
  <g filter="url(#shadow)">
    <circle cx="690" cy="700" r="130" fill="#F2B544"/>
  </g>
  <circle cx="690" cy="700" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
  <path d="M630 702 L672 744 L752 656" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
